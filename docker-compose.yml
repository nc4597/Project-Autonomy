services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: regiment
      POSTGRES_PASSWORD: regiment
      POSTGRES_DB: regiment_kyc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Separate database for apps/admin (deal/site-content CMS) — deliberately
  # its own Postgres instance, not a second database on the `postgres`
  # service above, since that one backs the KYC/AML test infra and is
  # expected to be torn down independently of the marketplace-content data.
  postgres-admin:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: regiment
      POSTGRES_PASSWORD: regiment
      POSTGRES_DB: regiment_admin
    ports:
      - "5433:5432"
    volumes:
      - postgres-admin-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: regiment
      MINIO_ROOT_PASSWORD: regiment123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  postgres-admin-data:
  minio-data:
